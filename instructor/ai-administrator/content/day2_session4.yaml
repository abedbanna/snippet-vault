  # ---------------------------------------------------------------- Lab
  - layout: section
    title: "Practical lab: redesign your own map"
    subtitle: "Steps shown now, finish before Day 3"
    minute: 115
    duration: 5
    notes: >
      Five minutes to show the lab; the work itself is done before Day 3.

  - layout: steps
    title: "Lab steps"
    steps:
      - heading: "1 to 3. Classify, remove, add the Automation lane"
        text: "Duplicate your M3 page in draw.io; green, amber, red; delete RUBBER and REKEY; move green and amber into a new lane with an owner."
      - heading: "4 and 5. Score with a colleague"
        text: "One row per candidate in the M4-scoring template; where you disagree, take the higher risk and write why."
      - heading: "6. Plot and choose"
        text: "Pick one high value, low risk candidate. None? The highest-value one with risk 7 or below, and plan its gate."
      - heading: "7. Gate and ROI"
        text: "Gate diamond just before the first irreversible action; ROI as a range with assumptions."
      - heading: "8. Stress-test"
        text: "Send the sheet to the risk challenger or paste it into your assistant with the prompt."
    notes: >
      Share the handout, the template workbook and the draw.io example in the chat. Common mistakes: automating a RUBBER
      step, counting review time as saved, an Automation lane without an owner, a gate at the start of the process.

  - layout: prompt
    title: "Step 8: the stress-test prompt (for any assistant)"
    text: |
      Here is a scoring sheet of automation candidates for one business process. For each row, challenge the risk
      score: name one failure that would make it worse than scored. Then tell me which single candidate you would
      build first and why, in under 100 words.

      [paste your scoring sheet]
    notes: >
      The module's own prompt; the challenger bot runs a longer version of the same instructions, so participants without
      Telegram get a comparable answer.

  - layout: callout
    title: "Deliverable"
    text: "The future-state map (Automation lane with its owner, colours, the gate), the M4-scoring sheet with an ROI range, and one sentence naming the first build and its approval rule. Saved as M4-future-state. Bring it to Day 3: you build that candidate in n8n."
    notes: >
      Be explicit that Day 3 starts from the one sentence. Without a chosen candidate there is nothing to build.

  - layout: callout
    title: "Next: n8n on Day 3"
    text: "On Day 3 you build your chosen candidate in n8n. Do not sign up in advance: we open the free 14-day n8n Cloud trial together at the start of Day 3. Bring an e-mail address you can open during the session, and your M4-future-state file."
    notes: >
      Thirty seconds. The trial counts 14 days from sign-up, so everyone opens it together at the start of Day 3; anyone
      who signs up tonight loses days later in the course. n8n is not used in this session.

  # ---------------------------------------------------------------- Close
  - layout: bullets
    title: "Key takeaways"
    bullets:
      - "The future state is the same map with an Automation lane; what stays in the human lanes is the point."
      - "Remove before you automate: RUBBER approvals are deleted, REKEY steps disappear."
      - "Rule-based if you can write the rule; AI-judged if a person decides in seconds by reading; human-only for accountability or irreversibility."
      - "Score value in hours a month and risk 0 to 12; build high value, low risk first; leave low value, high risk alone."
      - "Place the gate as late as possible before the irreversible step, once per action, carrying the evidence."
    notes: >
      Read the five. Preview Day 3: the first automation in n8n, built from the candidate each participant chose today,
      starting with a trigger and the green steps.

  - layout: articles
    title: "Latest reading: redesign, then gate (2026)"
    items:
      - title: "Stop Automating Old Processes. Design New Ones Instead."
        source: "Harvard Business Review, by Masha Shunko and Serguei Netessine"
        date: "14 September 2026"
        url: "hbr.org/2026/09/stop-automating-old-processes-design-new-ones-instead"
        takeaway: "Returns come from redesigning the end-to-end workflow, not from automating individual tasks. That is today's exercise: remove first, then decide what the machine does."
      - title: "Human-in-the-Loop AI Agents: Where Humans Must Stay in Control in 2026"
        source: "Priya Nandan, AllAI News"
        date: "29 August 2026"
        url: "allainews.net/human-in-the-loop-ai-agents"
        takeaway: "'Human review can no longer be a ceremonial approval button'; it needs triggers, evidence, authority, escalation and a way to reverse. The three gate rules in one sentence."
      - title: "Loopjacking: Hijacking Human-in-the-Loop Approval"
        source: "Adithyan Arun Kumar, arXiv:2609.21081"
        date: "17 September 2026"
        url: "arxiv.org/abs/2609.21081"
        takeaway: "In several agent frameworks a person approved one action and the system executed a different one. A gate is only as good as the guarantee that what runs is what was approved (Day 6, security)."
    notes: >
      Optional two minutes or self-study. Checked on 8 October 2026; instructors may swap in newer pieces, keeping source,
      date and a one-line takeaway tied to the session.

  - layout: references
    title: "References"
    notes: >
      Leave on screen during questions. All figures were drawn for this course; the leave process and AI Caravan Ltd. are
      fictional.
