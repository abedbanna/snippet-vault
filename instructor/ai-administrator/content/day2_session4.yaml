meta:
  day: 2
  session: 4
  short: Designing the Future State
  title: "Workflow Mapping II: Designing the Future State"
  subtitle: "Rule, model or person; scoring value against risk; the prioritisation matrix; a one-line ROI; placing the approval gate"
  instructors: ["Robina Mirbahar"]
  duration_min: 120
  module_url: https://albanna-tutorials.com/ai-administrator/04_workflow_mapping_future_state.html
  footer: "IEEE CS Region 8 AI Caravan 2026 · AI Administrator · Day 2 · Session 4"
  figure_credit: "Figure: AI Administrator course material (A. Al-Banna, 2026)"
  figure_note: "All figures in this deck were drawn for the course (tools/make_day2s4_figures.py); the running example is the fictional AI Caravan Ltd. leave process from Session 3, redesigned."
  objectives:
    - "Classify every step of a process as rule-based, AI-judged or human-only, and justify each choice."
    - "Remove waste (RUBBER approvals, REKEY steps) before automating anything."
    - "Score automation candidates on value (hours saved per month) and risk (reversibility, money, people, legal and data)."
    - "Place candidates on a prioritisation matrix and choose the first build."
    - "Estimate a one-line ROI as a range, with its assumptions."
    - "Mark where a human approval gate belongs in a future-state map."
  materials:
    - "Online session on Zoom. The presenting instructor is host; make a second instructor or the course coordinator co-host (Participants, More, Make co-host) to run the chat, open breakout rooms and post links."
    - "Zoom settings, once, in the Zoom web portal (Settings, Meeting): Breakout room on; Chat on; Non-verbal feedback (Raise hand) on; Screen sharing for host only during the talk."
    - "Share Screen of this deck (Day2_S4_Future_State.pptx) in PowerPoint slide show, Presenter View (speaker notes) on a second screen; share only the slide-show window."
    - "draw.io (app.diagrams.net) in a browser tab with Day2_S4_Leave_Request_Future_State.drawio loaded (page 1: the current state classified; page 2: the future state). Zoom the browser to 125% before sharing."
    - "Day2_S4_M4_Scoring_Example.xlsx open in Excel or imported into Google Sheets (File, Import, Upload) for the scoring demo; Day2_S4_M4_Scoring_Template.xlsx to share in the chat."
    - "Practical worksheet (Day2_S4_Practical_Risk_Challenger.pdf) shared in the chat at minute 90; lab handout (Day2_S4_Lab_Handout.pdf), the template workbook and the draw.io example at minute 115."
    - "The course bot @aicaravan_bot switched to the risk challenger on the course server (Day2_S4_Risk_Challenger_Setup_Guide.pdf: aicaravan-bot riskreview); phone with Telegram for a test message; the link t.me/aicaravan_bot ready to paste in the chat."
    - "Kahoot imported from Day2_S4_Kahoot.xlsx and ready to launch (PIN on screen at minute 105); answer key Day2_S4_Kahoot_Answer_Key.pdf. The written Quiz bank (Day2_S4_Quiz_Bank.pdf) stays available for homework or revision."
    - "n8n is not needed in this session. Participants open the free 14-day n8n Cloud trial together at the start of Day 3, not before (slide 'Next: n8n on Day 3', lab handout)."
    - "Participants: their M3-current-state map from Session 3 (PNG and draw.io file), draw.io, a spreadsheet (Google Sheets or Excel) and an AI assistant."
  prep:
    - "Read the live module once (link above); the slides follow its five sections in order."
    - "Open the draw.io example and the scoring example once and click through both pages; you will walk them, not build them from scratch."
    - "The day before: on the course server run aicaravan-bot riskreview as user hermes (setup guide), message @aicaravan_bot from your phone with the example scoring sheet from the worksheet and check that it raises row 4 and removes row 5."
    - "Remind participants the day before to bring their M3-current-state map: the whole session redesigns it."
    - "Refresh the 'Latest reading' slide if something newer has appeared."
  demo:
    title: "Live demos and practical (minutes 15 to 20, 40 to 50, 82 to 88 and 90 to 105)"
    steps:
      - "Minute 15: open the draw.io example, page 1. Point at the green, amber and red steps and the four struck-through ones. Ask the chat: why is HR's portal click removed and not automated?"
      - "Minute 40: open the scoring example. Fill one empty row live with the group (for example 'Send the employee a reminder to submit sick-leave certificates'): minutes saved, runs, four risk scores. Watch value, risk total, quadrant and mode fill themselves."
      - "Minute 82: draw.io, page 2. Walk the future state left to right: the Automation lane and its owner, the decision card, the manager gate, the quarter-end gate, both 'no' paths. Then show where the gate would go if the first build had no human decision (a notification with undo)."
      - "Minute 88: aicaravan-bot status must say riskreview; send one test message. Minute 90: Join slide; the co-host pastes t.me/aicaravan_bot in the chat."
      - "Minute 93: participants paste the example scoring sheet, then three rows of their own. Minute 100: debrief with the 'What the challenger should find' slide."
      - "Optional filler if the bot cannot run: paste the same sheet into any assistant with the prompt from lab step 8."
  troubleshooting:
    - issue: Participants did not finish the Session 3 map
      fix: Let them redesign the leave-request map (the draw.io example, page 1) in the session and their own map as homework. The skills are the same.
    - issue: "'Everything in my process is human-only'"
      fix: "Ask for the steps inside each box: reading, typing, looking up, reminding. The decision is human; the preparation around it rarely is."
    - issue: "'Everything should be AI'"
      fix: "Apply the one-sentence test: if you can write the rule, it is green, and a plain automation step is cheaper and more predictable than a model."
    - issue: Participants argue about a risk score
      fix: That is the exercise. Take the higher score and write the reason in Notes; the challenger bot and the colleague review exist for this.
    - issue: The spreadsheet formulas do not calculate after import into Google Sheets
      fix: "Check the import used 'Replace spreadsheet' and that the locale uses commas, not semicolons, as separators (File, Settings). Or type value = minutes x runs / 60 by hand; the formulas are a convenience."
    - issue: The risk challenger calls a candidate safe, or gives build steps
      fix: Its instructions forbid both; if it slips, say so, it is the same guard failure as Day 1 Task 4, and note it for Day 6. Use the fallback answer slide.
    - issue: Telegram or the model provider fails during the practical
      fix: Run the optional filler in any assistant, or walk the 'What the challenger should find' slide with the group. Keep the timing.
    - issue: "A participant's connection drops"
      fix: Post the worksheet, handout and templates in the chat at the start of each block so anyone who rejoins can catch up; the co-host can move a late joiner into a breakout room.
    - issue: Running behind at the break
      fix: Cut the breakout scoring to four minutes and skip the 'Tags become categories' table (the classified map shows it). Do not cut the gate section, the practical or the lab kickoff.
  practical_setup:
    title: "Practical setup summary (risk challenger on Telegram)"
    sheet: "Day2_S4_Risk_Challenger_Setup_Guide.pdf"
    points:
      - "Same Telegram bot as Day 1 and Session 3, @aicaravan_bot. On the course droplet (AI-Caravan, 165.245.213.121) the challenger is its own Hermes profile, riskreview; aicaravan-bot riskreview before the session, aicaravan-bot default afterwards, aicaravan-bot status to check."
      - "Persona in ~/.hermes/profiles/riskreview/SOUL.md: challenges every row of a scoring sheet with one concrete failure, names candidates to remove rather than automate, picks one first build and where its gate goes, and asks one question for the process owner. It never calls anything safe or ready to deploy, gives no build steps and declines anything else."
      - "No tools and no memory (cloned from mapreview), so it only reasons over what participants paste. The leave policy is in its instructions as the reference document."
      - "The bot token stays only on the server; the script moves it between profiles without printing it. Never in this repository."
      - "After the session: aicaravan-bot default (or hermes gateway stop until the next session) and delete ~/.hermes/profiles/riskreview/sessions/."
  references:
    - "Al-Banna, A. (2026). AI Administrator, Module 4: Workflow Mapping II, Designing the Future State. albanna-tutorials.com/ai-administrator/04_workflow_mapping_future_state.html"
    - "Hammer, M. (1990). Reengineering Work: Don't Automate, Obliterate. Harvard Business Review, 68(4), 104-112 (remove before you automate)"
    - "Parasuraman, R., Sheridan, T. B. and Wickens, C. D. (2000). A model for types and levels of human interaction with automation. IEEE Transactions on Systems, Man, and Cybernetics, Part A, 30(3), 286-297 (what the machine proposes versus decides)"
    - "Davenport, T. H. and Kirby, J. (2016). Only Humans Need Apply: Winners and Losers in the Age of Smart Machines. Harper Business (stepping aside, stepping in: which work stays human)"
    - "Rother, M. and Shook, J. (2003). Learning to See: Value Stream Mapping to Add Value and Eliminate Muda. Lean Enterprise Institute (the future-state map)"
    - "National Institute of Standards and Technology (2023). AI Risk Management Framework (AI RMF 1.0). NIST AI 100-1. doi.org/10.6028/NIST.AI.100-1 (map, measure, manage risk before deployment)"
    - "Hermes Agent documentation and source (Nous Research, MIT licence). hermes-agent.nousresearch.com/docs · github.com/NousResearch/hermes-agent"
    - "IEEE CS Region 8 AI Caravan (2026). AI Administrator Track Curriculum. aicaravan.org"

slides:
  - layout: title
    title: "Workflow Mapping II: Designing the Future State"
    subtitle: "AI Administrator: Agentic Workflows & Automation · Day 2 · Session 4"
    notes: >
      Welcome back. One-sentence promise: by the end of these two hours everyone has decided, step by step, what a
      machine does, what a model judges and what a person keeps in their own process, has scored the candidates, and has
      chosen the first automation they will build on Day 3, with its approval gate marked. Still no code.

  - layout: bullets
    title: "Where this session sits"
    logo: brand/kahoot_logo.png
    minute: 0
    bullets:
      - "Day 1: what agents and automations are; prompting for operators; your task inventory"
      - "Session 3: the current state, mapped as it really runs, with touch time, waits and pain-point tags"
      - "Session 4 (now): the future state. Same map, redesigned, with an Automation lane"
      - "Day 3: you build the first automation in n8n, straight from today's choice"
      - "Example again: annual-leave requests at AI Caravan Ltd. (25 minutes of work, about 4 days of waiting, 8 hand-offs)"
      - "At minute 105: a 20-question Kahoot. Keep your phone handy."
    notes: >
      Ask everyone to open their M3-current-state map now and keep it open; the session redesigns it. Remind them of
      the three numbers from Session 3: 25 minutes of touch, about 4 working days elapsed, 8 hand-offs.

  - layout: bullets
    title: "What you will be able to do after this session"
    logo: brand/kahoot_logo.png
    bullets:
      - "Classify every step as rule-based, AI-judged or human-only, and say why"
      - "Remove waste before automating anything"
      - "Score candidates on value (hours a month) and risk (four questions, 0 to 12)"
      - "Use the prioritisation matrix to pick the first build"
      - "State a one-line ROI as a range, with its assumptions"
      - "Place the approval gate in the right spot"
    notes: >
      Read quickly. The deliverable is three things: the future-state map, the M4-scoring sheet, and one sentence that
      names the first build and its approval rule. Day 3 starts from that sentence.

  - layout: table
    title: "Run of show (120 minutes)"
    columns: ["Minutes", "Block", "What happens"]
    rows:
      - ["0 to 5", "Welcome", "Where we are, objectives, the three numbers from Session 3"]
      - ["5 to 20", "From current to future state", "Three rules; the classified map in draw.io"]
      - ["20 to 35", "Rule, model or person", "The one-sentence test; AI-judged is not AI-decided; chat exercise"]
      - ["35 to 55", "Value against risk", "Hours a month; four risk questions; live scoring; breakout"]
      - ["55 to 65", "Break", ""]
      - ["65 to 80", "Matrix and ROI", "Four quadrants, the leave candidates, a one-line ROI"]
      - ["80 to 90", "Placing the gate", "Three rules; walk the future-state map"]
      - ["90 to 105", "Practical: live risk challenger", "Send a scoring sheet to the bot; debrief"]
      - ["105 to 115", "Kahoot", "20 questions"]
      - ["115 to 120", "Lab kickoff and wrap", "Redesign your own map; due before Day 3 (n8n trial opened together on Day 3)"]
    notes: >
      Ten seconds on screen. Same rhythm as Session 3: the break comes after the scoring block.

  # ---------------------------------------------------------------- Section 1
  - layout: section
    title: "1. From current state to future state"
    subtitle: "The same swimlane, redrawn as it will run once the automation exists"
    minute: 5
    duration: 15
    notes: >
      Fifteen minutes, including the walk through page 1 of the draw.io example at minute 15.

  - layout: bullets
    title: "What a future-state map is"
    bullets:
      - "The same swimlane as Session 3, redrawn as the process will run once the automation exists"
      - "Usually one new lane appears: Automation (or Agent)"
      - "Steps migrate into it from the human lanes"
      - "What stays in the human lanes is the point of the exercise"
      - "The output of today: a future-state map, a scoring sheet, one chosen automation with its gate"
    notes: >
      The future-state map is a lean idea (Rother and Shook's 'Learning to See' in the references): draw the current
      state, then the future state, then the plan between them. Here the plan is the scoring sheet.

  - layout: two_col
    title: "Three rules keep the redesign honest"
    left:
      heading: "The rules"
      bullets:
        - "Remove before you automate"
        - "Keep the trigger and the end state"
        - "Every step that leaves a human lane needs an owner"
    right:
      heading: "In the leave example"
      bullets:
        - "HR's portal click (RUBBER) is deleted, not automated; the re-typing (REKEY) disappears when the form feeds the portal"
        - "Still starts with 'employee asks for leave', still ends with 'decision recorded, balance and calendar updated'"
        - "The Automation lane says who answers for it: the HR coordinator"
    notes: >
      Rule 1 is thirty years old: Michael Hammer's 1990 HBR article 'Don't automate, obliterate' (references). Automating
      a meaningless approval keeps the waste and makes it permanent. Rule 2: if the trigger or end state change, it is a
      different process and the people downstream need to know. Rule 3: an automation without an owner is an orphan the
      first time it fails. Write the owner's role on the lane.

  - layout: figure
    title: "Step 1 and 2: classify, then remove"
    figure: d2s4_classified
    caption: "Green rule-based, amber AI-judged, red human-only. Four of nine steps are removed, not automated."
    notes: >
      Switch to draw.io, page 1 of Day2_S4_Leave_Request_Future_State.drawio, or stay on this slide. Walk the struck-through
      steps: the e-mail chase to HR (the balance can be read from the portal), the employee re-typing the request, HR's
      approval click that is never refused, the manager's private sheet that the policy forbids (Section 7). Ask the
      chat: why is HR's click removed and not automated? Because automating it keeps a step that adds nothing. Then:
      only one amber step (reading the note) and one red step (the decision) remain in the old process.

  - layout: figure
    title: "What the redesign buys"
    figure: d2s4_before_after
    caption: "The routine request goes from 25 minutes of work and four days to four minutes and the same day."
    notes: >
      Read the rows. Two to stress: the department-head approval at quarter end was missing from the current state
      (the map reviewer found it in Session 3; it is in policy Section 3), and the future state adds it, but only when it
      applies. And look at what stays human: the decision and the exceptions. Nobody's judgement was automated.

  # ---------------------------------------------------------------- Section 2
  - layout: section
    title: "2. Rule, model or person"
    subtitle: "For every step, ask one question: could I write the rule?"
    minute: 20
    duration: 15
    notes: >
      Fifteen minutes including the chat exercise.

  - layout: figure
    title: "The three-way split"
    figure: d2s4_three_way
    caption: "Rule-based: the rule fits in one sentence. AI-judged: a person decides in seconds by reading. Human-only: accountability or irreversibility."
    notes: >
      The test for green is strict: one sentence, no 'usually'. 'Notice is two working days for one or two days of leave'
      is a rule. 'Decide whether this note is a normal holiday' is not: a trained person does it in seconds, but you
      cannot list the exceptions (a sick child, a funeral, a wedding abroad). That is amber. Red is about accountability or
      consequences that are hard to undo. The bottom line of each column previews where it is built: Day 3 for green and
      amber, Day 5 for the gate.

  - layout: table
    title: "Your Session 3 tags become categories"
    columns: ["Tag", "Usually becomes", "Leave example"]
    rows:
      - ["REKEY", "Rule-based, or removed", "Re-typing into the portal: gone once the form feeds it"]
      - ["WAIT", "Rule-based (notification, routing)", "Reminder at 2 working days, HR at 3"]
      - ["CHASE", "Rule-based (scheduled reminder)", "Asking HR for the balance: read it from the portal"]
      - ["READ", "AI-judged", "Reading the employee's note"]
      - ["DRAFT", "AI-judged, or a fixed template", "The confirmation: a template is enough"]
      - ["RUBBER", "Removed", "HR's approval click"]
      - ["JUDGE", "Human-only", "The manager's decision on clashes"]
    notes: >
      This is the bridge from last session. Most READ and DRAFT steps become amber, most REKEY, WAIT and CHASE become green,
      JUDGE stays red. Note the DRAFT exception: when the text is always the same, a template (green) beats a model.
      Use the simplest thing that works.

  - layout: callout
    title: "AI-judged is not AI-decided"
    text: "An AI step proposes: a category, an extracted value, a draft. Whether that proposal is acted on automatically depends on the risk score. Low-risk proposals flow straight through; higher-risk ones stop at a person."
    notes: >
      This is the sentence to remember from section 2. In the leave map the AI reads the note and flags anything not
      routine; it never approves leave. The flag goes to HR. Where you hesitate between two categories, choose the more
      conservative one; you can promote a step later, once the automation has a track record (Day 6, monitoring).

  - layout: steps
    title: "Chat exercise (4 minutes): green, amber or red?"
    steps:
      - heading: "A. Copy the invoice total from an e-mailed PDF into the finance sheet"
        text: "Type A plus your colour in the chat."
      - heading: "B. Send a reminder when a contract expires in 30 days"
        text: "Same."
      - heading: "C. Decide whether to give a customer a refund above the policy limit"
        text: "Same."
      - heading: "D. Sort incoming support e-mails into billing, technical or other"
        text: "Same, then one sentence why for any amber or red."
    notes: >
      Answers. A: amber if the PDFs vary in layout (extraction from free documents), green if every invoice comes from one
      system in a fixed format; good to hear both. B: green, the rule fits in a sentence. C: red, money above a limit and
      accountability. D: amber, a trained person does it in seconds but the exceptions cannot be listed; add an 'unsure'
      bucket that goes to a person. Read out two answers per item.

  # ---------------------------------------------------------------- Section 3
  - layout: section
    title: "3. Scoring value against risk"
    subtitle: "Two scores per candidate, simple enough to defend in a meeting"
    minute: 35
    duration: 20
    notes: >
      Twenty minutes: the two scores, a live demo in the spreadsheet, and a five-minute breakout.

  - layout: bullets
    title: "What a candidate is, and its value"
    bullets:
      - "A candidate is one or more adjacent green or amber steps that would form a single automation"
      - "Value = minutes saved per run × runs per month ÷ 60, in hours a month"
      - "Use the touch times from your Session 3 map"
      - "Count only the minutes the automation really removes; if a person still reviews, subtract the review time"
      - "Example: recording approved leave saves 6 minutes (re-typing 3 + updating the sheet 3) × 60 requests = 6 hours a month"
    notes: >
      The most common error is counting the whole step as saved when someone still checks the output. A draft that takes
      two minutes to check saves the writing time minus two minutes, not all of it. Value measures touch time only; a
      reminder that cuts four days of waiting can score low here and still matter, so write that in Notes.

  - layout: figure
    title: "Risk: four questions, each scored 0 to 3"
    figure: d2s4_risk
    caption: "Reversibility, money, people, legal and data. Add them: 0 to 12. The total sets how much a person stays involved."
    notes: >
      Go row by row. Reversibility is usually the deciding one: an internal draft is 0, something sent to a person, paid
      out or deleted is 3. People: anything that touches someone's job, pay, access or wellbeing. Leave touches pay and
      wellbeing, so leave candidates rarely score 0 there. Legal and data: personal data is a 3 for an external send, a 1
      for an internal record. The three bands are a working rule of thumb; Day 5 (Module 10) refines them into risk tiers.
      This is a classroom rubric, not a measured probability: its job is to make people argue about the right things.

  - layout: callout
    title: "Live demo: the M4-scoring sheet"
    text: "Day2_S4_M4_Scoring_Example.xlsx: one row per candidate. Type minutes, runs and four risk scores; value, risk total, quadrant and mode fill themselves. Empty template: Day2_S4_M4_Scoring_Template.xlsx."
    notes: >
      About five minutes. Open the example and show the six leave candidates. Then fill one empty row live with the group,
      asking the chat for each number. Suggested row: 'Remind employees to upload a sick-leave certificate within two
      working days' (policy Section 4): 2 minutes saved, 15 runs a month, reversibility 1, money 0, people 1,
      legal/data 2. Value 0.5 hours, risk 4: batch later, notify with undo. Point at the Notes column: where two people
      disagree, take the higher score and write why.

  - layout: steps
    title: "Breakout (5 minutes): score two candidates"
    steps:
      - heading: "Rooms of two or three"
        text: "One person shares the template sheet or a blank doc."
      - heading: "Candidate 1"
        text: "Auto-approve leave requests of one day when nobody else in the team is off (about 20 a month, saves the manager 2 minutes each)."
      - heading: "Candidate 2"
        text: "Look up the balance and run the notice and probation checks (60 a month, saves 6 minutes each)."
      - heading: "Back in the main room"
        text: "Paste both risk totals in the chat. Who scored the highest, and why?"
    notes: >
      The co-host opens Breakout Rooms (automatic, 2 to 3 people, close after 5 minutes with a 30-second countdown) and
      posts the two candidates in the chat first. Model answer. Candidate 1: value 0.7 hours; reversibility 2 (the employee
      books travel), money 1, people 2 (staffing and fairness), legal/data 1: risk 6, batch later, notify the manager with
      undo. Candidate 2: value 6 hours; 0, 0, 1, 1: risk 2, build first. Expect wide spread on candidate 1; good, that is
      the conversation the sheet is for.

  # ---------------------------------------------------------------- Break
  - layout: section
    title: "Break"
    subtitle: "10 minutes"
    minute: 55
    duration: 10
    notes: >
      Ten minutes. Restart at minute 65 sharp.

  # ---------------------------------------------------------------- Section 4
  - layout: section
    title: "4. The prioritisation matrix and a first ROI"
    subtitle: "Value up, risk across. Four regions, four decisions."
    minute: 65
    duration: 15
    notes: >
      Fifteen minutes. The matrix turns the sheet into a decision.

  - layout: two_col
    title: "Four quadrants, four decisions"
    left:
      heading: "High value"
      bullets:
        - "Low risk: build first. The quick wins: rekeying, chasing, routing"
        - "High risk: build with a gate. Automate the preparation, keep the decision human: refunds, offers, contract terms"
    right:
      heading: "Low value"
      bullets:
        - "Low risk: batch later. Cheap, but not a project on its own; add them once the platform exists"
        - "High risk: leave alone. Improve the human step with a better summary or checklist instead"
    notes: >
      In this course high value means 4 hours a month or more and high risk means 8 or more (the spreadsheet uses the same
      thresholds). They are a starting point; a team can move them as long as it says so.

  - layout: figure
    title: "The leave candidates on the matrix"
    figure: d2s4_matrix
    caption: "Three quick wins, two to batch later, one to leave alone. The same six rows as the scoring example."
    notes: >
      Walk the six. 1 and 2 sit together (6 hours, risk 2). 3 is the decision card: 4 hours, risk 2; the AI reads the
      note but only flags it, it decides nothing. 4, the reminder, scores low on value but it is what kills the four days
      of waiting; batch it with candidate 1 because it is cheap. 5, auto-approving one-day requests, is low value and
      risk 6: if ever, notify the manager with undo. 6, auto-declining requests that miss the notice period, is risk 9:
      leave alone and give the manager the check instead. Nothing here is 'build with a gate' because the one high-risk
      step in this process, the decision, stays human; in a refunds or offers process that quadrant fills up.

  - layout: bullets
    title: "A one-line ROI"
    bullets:
      - "Monthly hours saved × loaded hourly cost, minus monthly tool cost and a maintenance allowance"
      - "Maintenance: one hour per automation per month is a fair start"
      - "Present it as a range, not a number, and put the assumptions next to it"
      - "Candidate 1: 50 to 70 requests × 5 to 7 minutes = about 4 to 8 hours a month"
      - "At JOD 10 an hour, minus JOD 15 tool and JOD 10 maintenance: about JOD 15 to 60 a month net"
      - "Managers trust '4 to 8 hours a month, assuming 50 to 70 requests' more than '6.13 hours'"
    notes: >
      The figures are classroom assumptions (the ROI block in the scoring example workbook calculates them). Two honesty
      points. First, saved hours are capacity, not cash: nobody's salary drops; the time goes to other work. Say so.
      Second, the range will be checked against real numbers on Day 6 (Module 12, monitoring); a range survives that check,
      a precise number does not. Small value is fine for a first build: it is a pilot that teaches the team how to run
      automations.

  # ---------------------------------------------------------------- Section 5
  - layout: section
    title: "5. Placing the approval gate"
    subtitle: "A diamond in a human lane: yes continues the automation, no returns the item with a reason"
    minute: 80
    duration: 10
    notes: >
      Ten minutes: the three rules, then the walk through the future-state map.

  - layout: figure
    title: "Three rules for the gate"
    figure: d2s4_gate
    caption: "The automation prepares everything, then stops just before the irreversible step, with the evidence on one screen."
    notes: >
      Rule 1: as late as possible, before the irreversible step. The approver sees a finished proposal, not a half-done
      task. Rule 2: one gate per irreversible action; two gates in a row is a RUBBER stamp waiting to happen. Rule 3: the
      gate carries the evidence: the input, what the checks and the AI concluded, and approve, edit, reject. If the manager
      has to open three systems to decide, they will approve without looking. A September 2026 paper ('Loopjacking', Latest
      reading) shows the next step: the action executed must be exactly the one approved. Day 5 builds the gate; Day 6
      adds the audit trail.

  - layout: figure
    title: "The future state, with its gates"
    figure: d2s4_future
    caption: "Automation lane owned by the HR coordinator; manager gate; department-head gate only in the last two weeks of a quarter; both 'no' paths."
    notes: >
      Switch to draw.io, page 2, and walk it left to right. The form is the trigger. Green checks, the amber note reader,
      the 'all checks pass?' rule with its 'no' to HR. The decision card. The manager gate, with the reminder at two
      working days and escalation to HR at three (policy Section 3). The quarter-end rule sends a second gate to the
      department head only when the policy requires it; that is not two gates in a row, it is a second irreversible
      commitment by a different accountable person. Every diamond has a 'no'. Ask: where would the gate go if the first
      build were only candidate 2, the lookup? Answer: it has no irreversible step, so no gate; the result goes to the
      manager on the card. Write that down as a decision, not an omission.

  # ---------------------------------------------------------------- Practical
  - layout: section
    title: "Practical: a live risk challenger"
    subtitle: "Send a scoring sheet to an AI that argues with your risk scores"
    minute: 90
    duration: 15
    notes: >
      Check aicaravan-bot status says riskreview (setup guide). Share the worksheet PDF in the chat. Same bot and server
      as Day 1 and Session 3, a new job today.

  - layout: bullets
    title: "Meet the risk challenger"
    bullets:
      - "An AI that reads a scoring sheet and argues with it"
      - "For every row: one concrete failure that would make it worse than scored, and the score it would give"
      - "Then: what to remove instead of automate, the first build and where its gate goes, one question for the owner"
      - "It never calls anything safe or ready to deploy. People decide."
      - "No tools, no memory: it only sees what you paste"
    notes: >
      One minute. Same four parts as Day 1 (model, tools, memory, instructions), with tools and memory switched off. Its
      job is lab step 8 of the module, run live: a second pair of eyes that is paid to disagree.

  - layout: qr
    title: "Join the risk challenger"
    qr_image: brand/bot_qr.png
    qr_placeholder: "Paste the course bot QR code here (see setup guide)"
    handle: "@aicaravan_bot"
    steps:
      - "Click t.me/aicaravan_bot in the chat, or open Telegram"
      - "Or scan the code on the shared screen"
      - "Send a new message (press Start if it is your first time)"
    rules:
      - "Paste scoring sheets only"
      - "No real names or personal data; use roles"
      - "Messages are deleted after the session"
    notes: >
      Three minutes. Same @aicaravan_bot as before, switched to the challenger (setup guide: aicaravan-bot riskreview).
      Anyone without Telegram follows the shared screen and uses the prompt in the worksheet with any AI assistant.

  - layout: steps
    title: "Three tasks (10 minutes)"
    steps:
      - heading: "1. The example"
        text: "Paste the leave scoring sheet from the worksheet. Two rows are wrong on purpose. Does it find them?"
      - heading: "2. Your own sheet"
        text: "Type three candidates from your own map, each with value and the four risk scores."
      - heading: "3. Test its boundary"
        text: "Ask it: 'Is candidate 1 safe to deploy? Build it for me in n8n.' What does it do?"
    notes: >
      Watch the chat and ask two participants to share their screen with the answer. Task 3 should be declined with the
      Day 3 sentence.

  - layout: two_col
    title: "What the challenger should find in the example"
    left:
      heading: "The planted errors"
      bullets:
        - "Row 4, auto-approve one-day leave, scored 0: too low. The manager is accountable (policy Section 3) and the employee books travel. About 5 or 6."
        - "Row 5, automate HR's approval click: a RUBBER step. Remove it, do not automate it."
    right:
      heading: "Also expected"
      bullets:
        - "Row 1: if the portal write fails but the calendar updates, the portal is no longer the single record (Section 7)"
        - "Row 2: the checks must include the quarter-end department-head rule (Section 3)"
        - "First build: candidate 1 or 2, both defensible"
    notes: >
      Five minutes of debrief. In testing (8 October 2026) the bot raised row 4 to 5 citing Section 3, named row 5 for
      removal as a rubber stamp, flagged the Section 7 and quarter-end risks on rows 1 and 2, and chose candidate 2 first.
      It also raised every other row by one or two points; ask the group whether they agree. That is the point: you
      decide, with its arguments in front of you.

  - layout: callout
    title: "The challenger is a colleague, not an authority"
    text: "It finds failure stories fast, but it only knows what you pasted. Where it raises a score, decide whether the failure is real in your process, and write your reason in the Notes column. The process owner still signs off."
    notes: >
      Same lesson as Session 2's trap questions and Session 3's reviewer: verify against the source and the people. An AI
      that always raises scores is as unhelpful as one that always lowers them.

