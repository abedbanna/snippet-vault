meta:
  title: "Kahoot: Workflow Mapping II, Designing the Future State"
  subtitle: "AI Administrator · Day 2 · Session 4 · 20 questions"
  time: 20
  rules: >
    Written against the "longest answer is right" habit: on every question the four options are within a few
    characters of each other in length, the correct answer is spread evenly over positions A to D, and no option
    is "all of the above". Question text under 120 characters, answers under 75, as Kahoot requires.

questions:
  - q: "What usually appears in a future-state map that was not in the current state?"
    options: ["An Automation lane", "A second trigger", "A customer lane", "A longer end state"]
    answer: 0
  - q: "An approval is always given without reading (RUBBER). In the future state you..."
    options: ["Automate the click", "Remove the approval", "Add a second approver", "Give it to an AI step"]
    answer: 1
  - q: "Which must stay the same between the current and the future state?"
    options: ["The number of lanes", "The touch time", "Trigger and end state", "The people involved"]
    answer: 2
  - q: "Every step that moves into the Automation lane needs..."
    options: ["A language model", "A second reviewer", "Its own trigger", "An owner who answers"]
    answer: 3
  - q: "A step is rule-based when..."
    options: ["The rule fits one sentence", "A senior person does it", "It involves an e-mail", "It saves the most time"]
    answer: 0
  - q: "'Sort support e-mails into billing, technical or other' is usually..."
    options: ["Rule-based", "AI-judged", "Human-only", "Removed"]
    answer: 1
  - q: "'Approve a refund above the policy limit' is..."
    options: ["Rule-based", "AI-judged", "Human-only", "Removed"]
    answer: 2
  - q: "What does 'AI-judged is not AI-decided' mean?"
    options: ["AI is never used", "Only managers use AI", "AI decides at night", "AI proposes; risk decides"]
    answer: 3
  - q: "Which Session 3 tag usually stays human-only?"
    options: ["JUDGE", "REKEY", "CHASE", "WAIT"]
    answer: 0
  - q: "The confirmation e-mail is always the same text. Best category?"
    options: ["AI drafting step", "Rule-based template", "Human-only reply", "Remove the e-mail"]
    answer: 1
  - q: "Value of a candidate in this course is measured in..."
    options: ["Lines of code", "Number of steps", "Hours saved a month", "Tools replaced"]
    answer: 2
  - q: "Saves 6 minutes a run, 60 runs a month. Value?"
    options: ["60 hours a month", "10 hours a month", "36 hours a month", "6 hours a month"]
    answer: 3
  - q: "A person still spends 2 minutes checking each AI draft. You should..."
    options: ["Subtract it from saving", "Ignore it in value", "Add it to the risk", "Double the runs"]
    answer: 0
  - q: "Which is NOT one of the four risk questions?"
    options: ["Reversibility", "Staff popularity", "Legal and data", "Money involved"]
    answer: 1
  - q: "A candidate scores 9 on risk. How does it run?"
    options: ["Fully automatically", "Notify, with undo", "Stops at a gate", "Never at all"]
    answer: 2
  - q: "High value, low risk on the matrix means..."
    options: ["Leave alone", "Batch later", "Build with a gate", "Build first"]
    answer: 3
  - q: "Ten hours a month, risk 9. The right decision is..."
    options: ["Build with a gate", "Build fully auto", "Leave it alone", "Halve the value"]
    answer: 0
  - q: "Why state ROI as a range with assumptions?"
    options: ["It looks larger", "Inputs are estimates", "Managers want words", "Tools require it"]
    answer: 1
  - q: "Where does the approval gate go?"
    options: ["At the very start", "After every AI step", "Before the irreversible step", "After the e-mail goes out"]
    answer: 2
  - q: "The approver must open three systems to decide. The risk is..."
    options: ["Too many rejections", "The gate is too late", "The AI gets confused", "They approve unread"]
    answer: 3
