meta:
  title: "Kahoot: Workflow Mapping I, The Current State"
  subtitle: "AI Administrator · Day 2 · Session 3 · 20 questions"
  time: 20
  rules: >
    Written against the "longest answer is right" habit: on every question the four options are within a few
    characters of each other in length, the correct answer is spread evenly over positions A to D, and no option
    is "all of the above". Question text under 120 characters, answers under 75, as Kahoot requires.

questions:
  - q: "What does automation do to a process you have not mapped?"
    options: ["Freezes its workarounds", "Fixes its exceptions", "Makes it optional", "Deletes its approvals"]
    answer: 0
  - q: "The 'stranger rule': you may only automate a step that..."
    options: ["A manager has signed off", "A stranger could do", "Takes over an hour a day", "Already uses an AI model"]
    answer: 1
  - q: "In SIPOC, what does the 'P' column contain?"
    options: ["Every single keystroke", "The people involved", "Five to seven big steps", "The process owner"]
    answer: 2
  - q: "In SIPOC, who are the 'Customers'?"
    options: ["Those paying for the tool", "The software vendors", "The process designers", "Those receiving outputs"]
    answer: 3
  - q: "Why write the trigger down first?"
    options: ["Automation needs an event", "SIPOC forbids skipping it", "It makes the map shorter", "Triggers are always emails"]
    answer: 0
  - q: "In a swimlane, each lane belongs to..."
    options: ["One week of the process", "One actor or system", "One type of decision", "One pain-point tag"]
    answer: 1
  - q: "An arrow that crosses from one lane into another is..."
    options: ["A decision point", "A loop back", "A hand-off", "The end state"]
    answer: 2
  - q: "Why does the HR portal get its own lane?"
    options: ["draw.io requires a lane", "It looks more formal", "Systems never make you wait", "Typing in is a hand-off"]
    answer: 3
  - q: "Which shape marks a yes/no decision?"
    options: ["A diamond", "A rounded box", "A dashed box", "An arrow"]
    answer: 0
  - q: "A decision diamond has three exits. It is usually..."
    options: ["Drawn correctly", "Two decisions in one", "A step in disguise", "A trigger"]
    answer: 1
  - q: "Where do you write the wait time on a swimlane map?"
    options: ["Inside the step box", "In the lane title", "On the arrow", "In the SIPOC"]
    answer: 2
  - q: "25 minutes of work, 4 days elapsed. What is the best fix?"
    options: ["A bigger AI model", "Faster typists", "A full agent", "Routing and reminders"]
    answer: 3
  - q: "A manager re-types an emailed request into the HR portal. Tag?"
    options: ["REKEY", "JUDGE", "DRAFT", "RUBBER"]
    answer: 0
  - q: "HR approves every request without reading it. Tag?"
    options: ["READ", "RUBBER", "DRAFT", "CHASE"]
    answer: 1
  - q: "Someone emails HR to remind them to reply. Tag?"
    options: ["REKEY", "JUDGE", "CHASE", "DRAFT"]
    answer: 2
  - q: "Which tag marks a step to protect, not automate?"
    options: ["READ", "WAIT", "REKEY", "JUDGE"]
    answer: 3
  - q: "Which tag is usually fixed by an AI drafting step?"
    options: ["DRAFT", "WAIT", "CHASE", "RUBBER"]
    answer: 0
  - q: "Best opening question for a mapping interview?"
    options: ["How should it work?", "Walk me through the last one", "Would a bot help you?", "Do you follow the rules?"]
    answer: 1
  - q: "The manager keeps a private sheet the policy forbids. On the map?"
    options: ["Leave it off", "Only in a footnote", "Draw it: it is real", "Report the manager"]
    answer: 2
  - q: "The AI reviewer says a step is missing. What next?"
    options: ["Add it right away", "Ignore the reviewer", "Ask it to automate", "Check with the source"]
    answer: 3
