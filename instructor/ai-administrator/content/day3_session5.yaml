  - layout: bullets
    title: "In your breakout room"
    bullets:
      - "Everyone builds in their own workspace; one person shares their screen at a time"
      - "Stuck for more than three minutes? Ask for help (button at the bottom of Zoom)"
      - "Execute step after every node, and read the output panel before adding the next"
      - "Done early? Add the Error notifier, then help someone in your room"
      - "At minute 98 the rooms close; bring a screenshot of your sheet"
    notes: >
      The two instructors rotate through the rooms. Most common issues: wrong Google account (403), uploaded .xlsx,
      forgetting to click Execute before submitting the test form, IF set to String instead of Number.

  # ---------------------------------------------------------------- Section 5
  - layout: section
    title: "5. Make it safe, then publish"
    subtitle: "Retry, an error workflow, and the difference between test and production"
    minute: 100
    duration: 8
    notes: >
      Back in the main room. Eight minutes.

  - layout: figure
    title: "Retry on Fail"
    figure: d3s5_shot_16_retry_on_fail
    caption: "Node Settings: Retry On Fail, Max. Tries 3, Wait 5000 ms. Most failures are a mail server or an API that hiccups once."
    notes: >
      'On Error' below it decides what happens after the last try: stop the workflow (default) or continue.

  - layout: two_col
    title: "When it still fails: the error workflow"
    left:
      heading: "Build once"
      bullets:
        - "A separate workflow: Error Trigger, then Gmail to you"
        - "Message: workflow name and the execution link"
        - "Publish it"
    right:
      heading: "Attach to every workflow"
      bullets:
        - "Workflow menu, Settings, Error workflow"
        - "Now a silent failure becomes an e-mail"
        - "The link opens the failed run in Executions"
    notes: >
      An automation that fails silently is worse than no automation: people stop checking because they think it works.

  - layout: two_col
    title: "Test, then publish"
    left:
      heading: "Testing"
      bullets:
        - "Execute step: one node, with the data before it"
        - "Execute workflow: the whole run, once"
        - "Test URL listens for one submission"
        - "Runs show in Executions with a flask icon"
    right:
      heading: "Published"
      bullets:
        - "Publish (top right) makes it live"
        - "Production URL works for everyone, any time"
        - "n8n 2.43 and later: no publishing with unconnected required inputs"
        - "Change something? Test again, publish again"
    notes: >
      The module and older tutorials say 'Activate'; today's n8n says Publish. Same idea.

  # ---------------------------------------------------------------- Kahoot
  - layout: section
    title: "Kahoot"
    subtitle: "20 questions on today"
    logo: brand/kahoot_logo.png
    minute: 108
    duration: 10
