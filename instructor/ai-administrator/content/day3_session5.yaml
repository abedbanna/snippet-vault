  - layout: two_col
    title: "Join the Kahoot"
    left:
      heading: "How to join"
      bullets:
        - "kahoot.it on your phone, or the Kahoot app"
        - "Enter the PIN on the screen"
        - "Use your real first name"
    right:
      heading: "The rules"
      bullets:
