  # ---------------------------------------------------------------- Close
  - layout: callout
    title: "Deliverable"
    minute: 118
    text: "A published 'M5 Request intake' workflow with three test runs (small, large, incomplete), the Requests sheet showing three rows, and the exported JSON file. Optional: the Error notifier attached. Saved as M5-request-intake."
    notes: >
      Anyone who did not finish completes it before Session 6; the solution JSON is shared after the session.

  - layout: callout
    title: "Before you close the tab"
    text: "Menu, Export JSON, for every workflow you built today. The trial deletes the workspace after 14 days; your JSON files are your copy."
    notes: >
      Wait twenty seconds while they do it. Ask for a thumbs-up reaction in Zoom when done.

  - layout: bullets
    title: "Key takeaways"
    bullets:
      - "One trigger, then actions; data moves as items and each node runs once per item."
      - "Every node implements one step of the future-state map; the human decisions stay human."
      - "Execute step after every node and read its output; test the empty case on purpose."
      - "Credentials live in the credential store, on the same account as your data."
      - "Retry, an error workflow, then publish. Export your JSON every day."
    notes: >
      Preview Session 6: the same request intake gets an AI step that classifies the description, with an 'unsure'
      route to a person.

