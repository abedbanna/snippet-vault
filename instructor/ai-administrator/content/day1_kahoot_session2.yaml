meta:
  title: "Kahoot: Prompting for Operators"
  subtitle: "AI Administrator · Day 1 · Session 2 · 20 questions"
  time: 20
  rules: >
    Written against the "longest answer is right" habit: on every question the four options are within a few
    characters of each other in length, the correct answer is spread evenly over positions A to D, and no option
    is "all of the above". Question text under 120 characters, answers under 75, as Kahoot requires.

questions:
  - q: "A prompt is best thought of as..."
    options: ["A work instruction", "A friendly chat", "A search query", "A password"]
    answer: 0
  - q: "Which of these is NOT one of the five parts of a working prompt?"
    options: ["Role", "Context", "Signature", "Constraints"]
    answer: 2
  - q: "A prompt gives a different shape of answer every run. Which part is probably missing?"
    options: ["Output format", "Role", "Greeting", "Context"]
    answer: 0
  - q: "What is the standard a prompt must meet before it goes inside an automation?"
    options: ["It sounds polite", "It is under 50 words", "It is written in English", "It repeats the same shape"]
    answer: 3
  - q: "Which line turns a confident wrong answer into a flag a person can act on?"
    options: ["Be very accurate", "If unclear, say unclear", "Answer quickly", "Use bullet points"]
    answer: 1
  - q: "'Category must be one of: billing, technical, sales, other' is an example of..."
    options: ["A role statement", "A few-shot example", "Stating allowed values", "A greeting"]
    answer: 2
  - q: "Few-shot prompting means..."
    options: ["Showing worked examples", "Asking several times", "Using very short prompts", "Splitting across models"]
    answer: 0
  - q: "Why do examples work better than descriptions?"
    options: ["Models copy patterns well", "Examples are shorter", "Models ignore rules", "Examples cost less"]
    answer: 0
  - q: "How many test inputs does the module ask you to collect for a classifier?"
    options: ["Three", "Five", "Ten", "Fifty"]
    answer: 2
  - q: "Two of ten test emails are mislabelled. The right fix is to..."
    options: ["Add 'be more accurate'", "Delete the two emails", "Add a constraint or example", "Use a longer prompt"]
    answer: 2
  - q: "After fixing a prompt, what do you re-run?"
    options: ["Only the failed rows", "All ten rows", "A brand new set", "Nothing, it is fixed"]
    answer: 1
  - q: "Why keep the ten-row test set after the prompt works?"
    options: ["To prove the work", "Models and prompts change", "It has no further use", "To train the model"]
    answer: 1
  - q: "ChatGPT Projects, Claude Projects, Gems and Copilot agents all let you..."
    options: ["Train your own model from scratch", "Send emails on your behalf", "Run n8n workflows for you", "Save instructions with files"]
    answer: 3
  - q: "A department assistant built from a Project with documents has which agent parts?"
    options: ["Model, instructions, memory", "Model and tools only", "Tools and memory only", "Instructions only"]
    answer: 0
  - q: "'Data goes where the model goes' is a warning about..."
    options: ["Slow internet connections", "Prompts that are too long", "Using two models at once", "Uploading sensitive documents"]
    answer: 3
  - q: "Hallucination is when the model..."
    options: ["Refuses to answer", "Answers too slowly", "Produces a plausible fact", "Repeats the question"]
    answer: 2
  - q: "Which is NOT one of the three habits that catch hallucination?"
    options: ["Ground it in a real source", "Give it an exit to say no", "Check the checkable facts", "Ask it to rate its confidence"]
    answer: 3
  - q: "'Summarise this email and tell me what to do' breaks which rule?"
    options: ["Always use a role line", "Never mention email", "Use a formal tone only", "One verb, one deliverable"]
    answer: 3
  - q: "Which product and feature pair is correct?"
    options: ["Gems: Microsoft Copilot", "Projects: Claude", "Custom GPTs: Gemini", "Notebooks: ChatGPT"]
    answer: 1
  - q: "In the lab, which documents may you upload to your assistant?"
    options: ["Your real HR files", "Any internal contract", "Public or made-up policies", "Colleagues' emails"]
    answer: 2
