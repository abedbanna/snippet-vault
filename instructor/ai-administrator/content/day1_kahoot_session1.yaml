meta:
  title: "Kahoot: Agents and Automation, Explained"
  subtitle: "AI Administrator · Day 1 · Session 1 · 30 questions"
  time: 20
  rules: >
    Written against the "longest answer is right" habit: on every question the four options are within a few
    characters of each other in length, the correct answer is spread evenly over positions A to D, and no option
    is "all of the above". Question text under 120 characters, answers under 75, as Kahoot requires.

questions:
  - q: "Who decides the steps in an automation?"
    options: ["The model, while it runs", "The designer, in advance", "The person using it", "The tool it calls"]
    answer: 1
  - q: "Who decides the steps in an agent?"
    options: ["The designer, in advance", "The person using it", "The model, while it runs", "The spreadsheet"]
    answer: 2
  - q: "A form submission creates a sheet row and sends a confirmation email. This is..."
    options: ["An automation", "An agent", "A multi-agent", "A chatbot"]
    answer: 0
  - q: "'Find out why this invoice was rejected and prepare a corrected version' is a task for..."
    options: ["A fixed script", "A daily report", "A form", "An agent"]
    answer: 3
  - q: "Which is NOT one of the four parts of an agent?"
    options: ["Memory", "Tools", "Dashboard", "Instructions"]
    answer: 2
  - q: "Which part of an agent is the system prompt?"
    options: ["Instructions", "Memory", "Tools", "The model"]
    answer: 0
  - q: "Which part lets an agent send an email or create a ticket?"
    options: ["Instructions", "Memory", "The model", "Tools"]
    answer: 3
  - q: "Which part makes an assistant seem to know your organisation?"
    options: ["Tools", "Memory", "The model", "The loop"]
    answer: 1
  - q: "What does a language model actually do?"
    options: ["Predicts the next word", "Searches a database", "Runs a fixed script", "Copies a web page"]
    answer: 0
  - q: "In the agent loop, what happens in the 'observe' step?"
    options: ["It writes the goal", "It asks a person", "It reads the tool result", "It picks a model"]
    answer: 2
  - q: "What is the correct order of the agent loop?"
    options: ["Act, think, observe", "Think, act, observe", "Observe, act, stop", "Act, stop, think"]
    answer: 1
  - q: "The ReAct pattern means..."
    options: ["React to user mood", "Reason, then act", "Run a fixed script", "Reply, then exit"]
    answer: 1
  - q: "Why does an agent need an iteration limit?"
    options: ["To run much faster", "To use more tools", "Each loop costs money", "Models tire quickly"]
    answer: 2
  - q: "'Tool quality is answer quality' means..."
    options: ["Buy only the costly tools", "Use many tools at once", "Tools must be coded first", "Agents know only tool output"]
    answer: 3
  - q: "Most useful office systems are..."
    options: ["Fully autonomous agents", "Workflows with AI steps", "Manual checklists", "Chatbots only"]
    answer: 1
  - q: "Sorting support emails into billing, technical and sales is best built as..."
    options: ["A workflow with AI step", "A full autonomous agent", "A scheduled report", "A manual task"]
    answer: 0
  - q: "Compiling a weekly status report from five trackers is best built as..."
    options: ["A full agent task", "A manual phone call", "A workflow with AI step", "A paper form"]
    answer: 2
  - q: "Researching three suppliers and preparing a comparison table is best built as..."
    options: ["An agent with tools", "A simple automation", "A scheduled email", "A manual task"]
    answer: 0
  - q: "Approving a refund above the policy limit should be..."
    options: ["A full agent task", "An automation", "An AI step", "Kept with a person"]
    answer: 3
  - q: "The rule of thumb for choosing a design is..."
    options: ["Most autonomy first", "Least autonomy that works", "Always use an agent", "Never use a model"]
    answer: 1
  - q: "Automation reliably removes which kind of work?"
    options: ["Deciding and judging", "Approving budgets", "Copying and chasing", "Hiring new staff"]
    answer: 2
  - q: "Decisions about money, people or law should..."
    options: ["Go to the agent", "Stay with a person", "Be automated", "Be skipped"]
    answer: 1
  - q: "The context window is..."
    options: ["The model's permanent disk", "A tab in the web browser", "The list of allowed tools", "All the model sees right now"]
    answer: 3
  - q: "What fixes a bare model's habit of guessing numbers and live facts?"
    options: ["A longer prompt", "A faster model", "A friendly tone", "Giving it tools"]
    answer: 3
  - q: "What fixes a bare model forgetting yesterday's conversation?"
    options: ["Adding memory", "A bigger screen", "More tools", "A new vendor"]
    answer: 0
  - q: "How does a model ask for a tool?"
    options: ["It runs the code by itself", "It emails the administrator", "It cannot ask for anything", "It writes a structured request"]
    answer: 3
  - q: "Where can a human sit in the agent loop?"
    options: ["Only at the very start", "Only at the very end", "Nowhere in the loop at all", "Before an action or at the end"]
    answer: 3
  - q: "An agent that is confused will typically..."
    options: ["Stop with an error", "Keep going wrongly", "Ask for a budget", "Shut itself down"]
    answer: 1
  - q: "OpenClaw and Hermes are examples of..."
    options: ["Spreadsheet add-on tools", "Email hosting providers", "Project tracking boards", "Always-on personal agents"]
    answer: 3
  - q: "What is the lab deliverable for this session?"
    options: ["A ten-row task inventory", "A working n8n flow", "A policy document", "A slide deck"]
    answer: 0
