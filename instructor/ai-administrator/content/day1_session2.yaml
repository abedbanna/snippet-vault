  # ---------------------------------------------------------------- Close
  - layout: bullets
    title: "Key takeaways"
    bullets:
      - "A prompt is a work instruction: role, context, task, constraints, output format. Missing parts cause most failures."
      - "Ask for labelled fields and allowed values, and show examples; that is what makes an answer usable by an automation."
      - "Improve prompts with a ten-row test set, one constraint or example at a time, and keep the set for later."
      - "Projects and custom assistants give the model your documents as memory; check data rules before uploading anything real."
      - "Ground the model, give it an exit, and verify the checkable facts."
    notes: >
      Read the five takeaways. Then set up the next session (Day 2, workflow mapping): bring the M1 task inventory and the M2 prompt library; next time we
      map the chosen task as a current-state process in Miro or draw.io.

  - layout: figure
    title: "Preview of Day 5: many assistants, one system"
    figure: multi-agent-components
    caption: "Each agent is model, tools, memory, instructions; a supervisor hands out work; a critic reviews it. Everything today scales up to this."
    bullets:
      - "Module 2 online, with the lab and quiz: albanna-tutorials.com/ai-administrator"
      - "LLM Agents explained visually: albanna-tutorials.com/llm_agents.html"
      - "Next: Day 2, Workflow Mapping I and II"
    notes: >
      Close on the big picture. Day 2 goes back to the process itself: before building anything, map it.

  - layout: articles
    title: "Latest reading on prompting for work (2026)"
    items:
      - title: "Prompting best practices (official Claude platform documentation)"
        source: "Anthropic, living document updated with each model release"
        date: "2026"
        url: "platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
        takeaway: "Be explicit about output format and constraints, give 2 to 5 worked examples, and separate context, instructions and examples with clear labels. The vendor's own version of today's five parts and few-shot examples."
      - title: "Prompt engineering for business: the 2026 practical guide"
        source: "Gend"
        date: "5 January 2026 (updated 30 March 2026)"
        url: "gend.co/blog/prompt-engineering-for-business"
        takeaway: "Proposes a business template, R-TCC-COE: role, task, context, content, constraints, output, evaluation. Same skeleton as today's template, plus an explicit evaluation rubric, which is what your ten-row test set provides."
      - title: "Production prompt engineering in 2026: structured outputs, prompt chaining and optimisation"
        source: "AI Workflow Lab, by Marcus Holloway"
        date: "13 February 2026 (updated 2 June 2026)"
        url: "aiworkflowlab.dev/article/production-prompt-engineering-2026-structured-outputs-prompt-chaining-dspy"
        takeaway: "Treat prompts as engineered, versioned, tested artefacts; constrain outputs to a fixed shape; split big tasks into chains of small prompts. The 'one verb, one deliverable' and 'fields not prose' rules, written for engineers."
      - title: "Context Engineering: from prompts to corporate multi-agent architecture"
        source: "V. Vishnyakova, arXiv 2603.09619"
        date: "10 March 2026"
        url: "arxiv.org/abs/2603.09619"
        takeaway: "Beyond the prompt, what matters is the whole information environment the model works in: documents, definitions, memory. Today's 'context' part and the department assistant's uploaded policies are the first step of that discipline."
    notes: >
      Optional two minutes, or leave for self-study. Each item ties a recent piece to something taught today.
      Instructors may swap in newer pieces; keep the pattern: source, date, one-line takeaway tied to the session.

  - layout: references
    title: "References"
    notes: >
      Leave on screen during questions. All diagrams in this deck are from Alammar and Grootendorst, Hands-On Large Language
