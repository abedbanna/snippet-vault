meta:
  title: "Kahoot: Automation Basics with n8n"
  subtitle: "AI Administrator · Day 3 · Session 5 · 20 questions"
  time: 20
  rules: >
    Written against the "longest answer is right" habit: on every question the four options are within a few
    characters of each other in length, the correct answer is spread evenly over positions A to D, and no option
    is "all of the above". Question text under 120 characters, answers under 75, as Kahoot requires.

questions:
  - q: "How many triggers does one n8n workflow have?"
    options: ["Exactly one", "None at all", "One per node", "One per app"]
    answer: 0
  - q: "A sheet node returns 40 rows. How often does the next Gmail node run?"
    options: ["Once", "40 times", "Twice", "Never"]
    answer: 1
  - q: "In n8n, one form submission arrives as..."
    options: ["Forty items", "A sheet row", "One item", "An e-mail"]
    answer: 2
  - q: "Which node is the start event of the leave request demo?"
    options: ["Gmail: Send", "IF node", "Code node", "Form Trigger"]
    answer: 3
  - q: "What does the n8n Cloud trial give you?"
    options: ["14 days, 1,000 runs", "30 days, unlimited", "7 days, 100 runs", "1 year, 10,000 runs"]
    answer: 0
  - q: "At the end of every session you should..."
    options: ["Delete the workflow", "Export the JSON", "Change your password", "Unpublish everything"]
    answer: 1
  - q: "What does a red triangle on a node usually mean?"
    options: ["It ran successfully", "It is an AI step", "Something to fill in", "It is published"]
    answer: 2
  - q: "The test form URL works..."
    options: ["Forever", "Only after Publish", "For everyone", "After you click Execute"]
    answer: 3
  - q: "Which URL do real users get after you publish?"
    options: ["The production URL", "The test URL", "The editor URL", "The webhook log URL"]
    answer: 0
  - q: "Sheets node error '403, the caller does not have permission'. Most likely cause?"
    options: ["The sheet is empty", "Wrong Google account", "Too many columns", "The IF node is wrong"]
    answer: 1
  - q: "Your sheet shows a green XLSX badge. Before n8n can read it you..."
    options: ["Rename the file", "Share it publicly", "Save as Google Sheets", "Delete the header row"]
    answer: 2
  - q: "Where should a Google password or API key live?"
    options: ["In a sticky note", "In the node's text", "In the e-mail body", "In the credential store"]
    answer: 3
  - q: "A blank Number field on an n8n form arrives as..."
    options: ["0", "an error", "the word null", "the text 'empty'"]
    answer: 0
  - q: "So the guard for a missing amount should test..."
    options: ["Amount is not empty", "Amount is greater than 0", "Amount exists", "Amount equals null"]
    answer: 1
  - q: "The IF says 900 is not greater than 500. What is wrong?"
    options: ["Gmail is offline", "The trial expired", "It compares as text", "The sheet is full"]
    answer: 2
  - q: "Retry On Fail with 3 tries and 5000 ms means..."
    options: ["Three e-mails sent", "Wait 3 seconds once", "Run 5,000 times", "Up to 3 tries, 5 s apart"]
    answer: 3
  - q: "What does an error workflow do?"
    options: ["Alerts you on failure", "Deletes failed runs", "Retries for ever", "Stops all workflows"]
    answer: 0
  - q: "Where do you see every past run, with its data?"
    options: ["The Templates page", "The Executions tab", "The Admin Panel", "The trial banner"]
    answer: 1
  - q: "In the leave demo, who approves or declines the leave?"
    options: ["The IF node", "The HR coordinator", "The line manager", "The Code node"]
    answer: 2
  - q: "Which Session 4 step stays human in the demo workflow?"
    options: ["Look up the balance", "Log the request", "E-mail the card", "The manager's decision"]
    answer: 3
