# Al-banna Tutorials portal hardening — drop into /etc/httpd/conf.d/ and run: apachectl configtest && systemctl reload httpd
# Requires mod_rewrite, mod_headers, mod_deflate, mod_expires (all standard on CentOS Stream httpd).

# --- Canonical host: www -> apex ---
# NOT here: mod_rewrite directives are not inherited from server config into a <VirtualHost>,
# so a rule in this file never runs for the site's :80 / :443 vhosts. The live rule lives inside
# the SSL vhost, /etc/httpd/conf.d/albanna-tutorials-le-ssl.conf (added 2026-09-03, backup at
# /root/albanna-tutorials-le-ssl.conf.bak-20260903-171752). That file is certbot-managed; if certbot
# ever regenerates it, re-add after the CustomLog line:
#
#     RewriteEngine On
#     RewriteCond %{HTTP_HOST} ^www\.albanna-tutorials\.com$ [NC]
#     RewriteRule ^ https://albanna-tutorials.com%{REQUEST_URI} [R=301,L]
#
# http://www is handled by certbot's own rule in albanna-tutorials.conf (http://www -> https://www
# -> apex, two hops).

# --- Custom error page ---
ErrorDocument 404 /404.html

# --- Compression ---
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json
</IfModule>

# --- Caching: long for static assets, short for HTML ---
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/html "access plus 1 hour"
  ExpiresByType text/css "access plus 7 days"
  ExpiresByType application/javascript "access plus 7 days"
  ExpiresByType image/png "access plus 30 days"
  ExpiresByType image/jpeg "access plus 30 days"
  ExpiresByType image/svg+xml "access plus 30 days"
  ExpiresByType image/x-icon "access plus 30 days"
  ExpiresByType application/json "access plus 1 hour"
</IfModule>

# --- Security headers ---
<IfModule mod_headers.c>
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
  # Report-only CSP first; tighten to enforcing once the console shows no violations.
  Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'"
  Header unset ETag
</IfModule>
FileETag None

# --- Correct MIME for the manifest ---
AddType application/manifest+json .webmanifest
